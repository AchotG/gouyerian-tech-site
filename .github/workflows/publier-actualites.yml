name: Publier les actualités programmées

# Aucun appel à Claude : ce workflow publie simplement les actualités déjà vérifiées
# (attente/programmees.json) dont l'heure "prevu" est arrivée.
on:
  schedule:
    - cron: '7 7 * * *'    # ≈ 8h-9h à Paris (heure UTC)
    - cron: '7 15 * * *'   # ≈ 16h-17h à Paris
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: publication-actualites
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publier ce qui est dû
        id: pub
        run: |
          set +e
          python3 outils/publier_programmees.py
          code=$?
          set -e
          if [ "$code" = "10" ]; then echo "publie=oui" >> "$GITHUB_OUTPUT"; elif [ "$code" != "0" ]; then exit $code; fi
      - name: Contrôler le JavaScript
        if: steps.pub.outputs.publie == 'oui'
        run: |
          python3 - <<'PY'
          s=open('source/gouyerian-tech.html',encoding='utf-8').read()
          i=s.index('const NEWS=[');j=s.index('\n];',i)
          open('/tmp/n.js','w',encoding='utf-8').write(s[i:j+3]+'\nif(NEWS.length>70||!NEWS[0].t)process.exit(1)')
          PY
          node /tmp/n.js
      - name: Enregistrer et déclencher le déploiement
        if: steps.pub.outputs.publie == 'oui'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gouyerian-tech-bot"
          git config user.email "actions@users.noreply.github.com"
          git add source/gouyerian-tech.html attente/programmees.json
          git commit -m "Actualités publiées (programmation automatique)"
          git pull -q --rebase origin main
          git push origin HEAD:main
          gh workflow run publier.yml --ref main
