# Construit le site à partir de source/gouyerian-tech.html, le teste, puis l'envoie sur l'hébergement IONOS (dossier /public) par SFTP.
# Se lance à chaque modification (par exemple une actualité ajoutée par la tâche automatique), chaque nuit, ou à la main.
# Réglages du dépôt (Settings → Secrets and variables → Actions) :
#   variables : IONOS_SFTP_HOST (ex. access-1234567.webspace-data.io), IONOS_SFTP_USER
#   secret    : IONOS_SFTP_PASSWORD (mot de passe SFTP créé par Achot chez IONOS)
# Suivi des réparations (facultatif tant que la base n'existe pas) :
#   secrets   : SUIVI_DB_HOST, SUIVI_DB_NAME, SUIVI_DB_USER, SUIVI_DB_PASSWORD (base MySQL créée chez IONOS),
#               GESTION_MOT_DE_PASSE (mot de passe de la page /gestion/ de l'atelier)
#   variable  : SUIVI_EXPEDITEUR (adresse d'envoi des e-mails, par défaut suivi@gouyerian-tech.fr)
name: Publier le site

on:
  push:
    branches: [main]
    paths-ignore:
      - "attente/**"   # la file d'attente des actualités n'est pas publiée
  schedule:
    - cron: "17 3 * * *"   # chaque nuit : met à jour les dates (« il y a 2 jours », sitemap)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    env:
      SUIVI_ACTIF: ${{ secrets.SUIVI_DB_HOST != '' && secrets.GESTION_MOT_DE_PASSE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils (Playwright + Chromium, lftp)
        run: |
          pip install playwright==1.48.0 pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y lftp
      - name: Vérifier le code PHP du suivi des réparations
        run: for f in serveur/api/*.php; do php -l "$f"; done
      - name: Contrôler les illustrations (bords, textes, centrage)
        run: python outils/gen_illus.py --controle
      - name: Construire les pages
        run: python outils/build.py
      - name: Tester le site (aucun envoi si un problème est trouvé)
        run: python outils/test_dist.py
      - name: Envoyer sur IONOS (/public)
        env:
          HOTE: ${{ vars.IONOS_SFTP_HOST }}
          UTILISATEUR: ${{ vars.IONOS_SFTP_USER }}
          MOT_DE_PASSE: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          if [ -z "$HOTE" ] || [ -z "$UTILISATEUR" ] || [ -z "$MOT_DE_PASSE" ]; then
            echo "::error::Accès SFTP IONOS non configuré (variables IONOS_SFTP_HOST, IONOS_SFTP_USER et secret IONOS_SFTP_PASSWORD)."
            exit 1
          fi
          # Envoie seulement les fichiers modifiés ; supprime de /public les pages qui n'existent plus (ex. actualité retirée).
          # Le mot de passe passe par la variable LFTP_PASSWORD (--env-password) : aucun souci avec les virgules, @, $ ou espaces.
          export LFTP_PASSWORD="$MOT_DE_PASSE"
          echo "Connexion à $HOTE avec l'utilisateur $UTILISATEUR (mot de passe de ${#MOT_DE_PASSE} caractères)"
          lftp --env-password -u "$UTILISATEUR" "sftp://$HOTE" -e "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; mirror --reverse --delete --only-newer --parallel=4 --verbose _site/ /public/; bye"
      - name: Configuration du suivi des réparations (hors du site, dans /prive)
        if: env.SUIVI_ACTIF == 'true'
        env:
          HOTE: ${{ vars.IONOS_SFTP_HOST }}
          UTILISATEUR: ${{ vars.IONOS_SFTP_USER }}
          MOT_DE_PASSE: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DB_HOST: ${{ secrets.SUIVI_DB_HOST }}
          DB_NAME: ${{ secrets.SUIVI_DB_NAME }}
          DB_USER: ${{ secrets.SUIVI_DB_USER }}
          DB_PASS: ${{ secrets.SUIVI_DB_PASSWORD }}
          GESTION_MDP: ${{ secrets.GESTION_MOT_DE_PASSE }}
          EXPEDITEUR: ${{ vars.SUIVI_EXPEDITEUR }}
          SMTP_PASS: ${{ secrets.SUIVI_SMTP_PASSWORD }}
          SUMUP_KEY: ${{ secrets.SUMUP_API_KEY }}
          SUMUP_MERCHANT: ${{ secrets.SUMUP_MERCHANT_CODE }}
        run: |
          umask 077
          # Fichier de configuration PHP écrit par PHP lui-même (guillemets et caractères spéciaux sans risque) ;
          # le mot de passe de la gestion n'y figure que haché.
          php -r '
            $c = [
              "dsn" => "mysql:host=" . getenv("DB_HOST") . ";dbname=" . getenv("DB_NAME") . ";charset=utf8mb4",
              "db_user" => getenv("DB_USER"), "db_pass" => getenv("DB_PASS"),
              "admin_hash" => password_hash(getenv("GESTION_MDP"), PASSWORD_DEFAULT),
              "mail_from" => getenv("EXPEDITEUR") ?: "suivi@gouyerian-tech.fr",
              "mail_reply" => "contact@gouyerian-tech.fr",
              "site" => "https://gouyerian-tech.fr",
            ];
            /* Envoi par le serveur SMTP d IONOS (authentifié avec la boîte d expédition) si le secret SUIVI_SMTP_PASSWORD existe */
            if (getenv("SMTP_PASS")) $c += ["smtp_host" => "smtp.ionos.fr", "smtp_port" => 465, "smtp_user" => $c["mail_from"], "smtp_pass" => getenv("SMTP_PASS")];
            /* Paiement en ligne SumUp si le secret SUMUP_API_KEY existe (SUMUP_MERCHANT_CODE facultatif : sinon lu chez SumUp) */
            if (getenv("SUMUP_KEY")) $c += ["sumup_key" => getenv("SUMUP_KEY"), "sumup_merchant" => (string)getenv("SUMUP_MERCHANT")];
            file_put_contents("gt-config.php", "<?php\n/* Configuration du suivi des réparations (écrite par GitHub, ne pas modifier à la main) */\nreturn " . var_export($c, true) . ";\n");'
          php -l gt-config.php >/dev/null
          printf 'Require all denied\n' > htaccess-prive
          export LFTP_PASSWORD="$MOT_DE_PASSE"
          lftp --env-password -u "$UTILISATEUR" "sftp://$HOTE" -e "set sftp:auto-confirm yes; set net:max-retries 3; set net:timeout 30; mkdir -p -f /prive; put gt-config.php -o /prive/gt-config.php; put htaccess-prive -o /prive/.htaccess; chmod 600 /prive/gt-config.php; bye"
          rm -f gt-config.php htaccess-prive
          echo "Configuration du suivi envoyée dans /prive."
      - name: Suivi des réparations pas encore activé
        if: env.SUIVI_ACTIF != 'true'
        run: |
          echo "::notice::Suivi des réparations non activé : ajouter les secrets SUIVI_DB_HOST, SUIVI_DB_NAME, SUIVI_DB_USER, SUIVI_DB_PASSWORD et GESTION_MOT_DE_PASSE."
